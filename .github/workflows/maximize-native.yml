name: AutoGluon native contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  autogluon-contract:
    name: AutoGluon contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime and AutoGluon
        run: python -m pip install -r requirements.txt autogluon.tabular==1.3.1 cloudpickle==3.1.1
      - name: Verify real grouped and temporal fits with full refit
        run: python experiment_autogluon_smoke.py --output data/experiments/autogluon_candidate/ci_native
      - name: Print native evidence summary
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('data/experiments/autogluon_candidate/ci_native/report.json')
          if not path.is_file():
              print('Native report not created; inspect the preceding failure.')
          else:
              report = json.loads(path.read_text(encoding='utf-8'))
              print(json.dumps({key: report.get(key) for key in (
                  'kind', 'quality_benchmark', 'status', 'source_commit', 'sources',
                  'versions', 'elapsed_seconds', 'api_requests', 'error_type', 'error'
              )}, ensure_ascii=True))
              for case in report.get('cases', []):
                  print(json.dumps(case, ensure_ascii=True))
