name: Проверка проекта

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Проверить окружение и тесты
        run: python dev_check.py
      - name: Собрать конкурсный архив
        run: python build_submission.py
